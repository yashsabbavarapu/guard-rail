[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guard-rail"
version = "0.1.0"
description = "Dual-path prompt injection and jailbreak firewall: sub-5ms heuristics plus an adversarial vector gate."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["llm", "security", "prompt-injection", "jailbreak", "guardrails"]
dependencies = [
    "pydantic>=2.6",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6","pytest>=8.0", "mypy>=1.9"]
# Only needed for the Gemini backend: the python.org macOS builds ship without
# a root certificate store, so urllib cannot verify the API's TLS chain.
remote = ["certifi>=2024.2.2"]

[project.scripts]
guardrail = "guardrail.cli:main"

[tool.setuptools]
packages = ["guardrail"]

[tool.setuptools.package-data]
guardrail = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_any_explicit = false
plugins = []

[[tool.mypy.overrides]]
module = "eval.*"
strict = true

[tool.ruff]
line-length = 125
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Adversarial payloads and detection patterns are long by nature; wrapping
# them would change the literals under test.
"guardrail/fast_path.py" = ["E501"]
"eval/test_prompts.py" = ["E501"]
# Fullwidth homoglyphs are the evasion payload under test, not a typo.
"tests/test_fast_path.py" = ["RUF001"]
